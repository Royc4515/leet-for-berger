name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run everything by hand (Actions tab), whatever changed.
  workflow_dispatch:

# A new push to the same PR cancels the run it replaces; every push to main keeps its run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What a change touches decides what runs, on a PR and on main alike (a push to main is compared
  # with the commit main pointed to before it). Unit tests are picked one by one: a test runs when
  # a changed file is among the files it reaches (imports, files it reads, and so on down;
  # scripts/ci/deps.mjs, owner's request). Each pattern below lists the files that can change that
  # check's outcome; when in doubt a path belongs in the pattern, not out of it.
  # ci.yml is in every pattern: a PR that edits a job must run that job before it merges.
  changes:
    runs-on: ubuntu-latest
    outputs:
      tests: ${{ steps.diff.outputs.tests }}
      e2e: ${{ steps.diff.outputs.e2e }}
      solutions: ${{ steps.diff.outputs.solutions }}
      db: ${{ steps.diff.outputs.db }}
      python: ${{ steps.diff.outputs.python }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: diff
        run: |
          all() {
            for k in e2e solutions db python; do echo "$k=true" >> "$GITHUB_OUTPUT"; done
            echo "tests=$(ls tests/*.test.js | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then all; fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # The PR checkout is a merge commit: its first parent is the base branch tip.
            files=$(git diff --name-only HEAD^1 HEAD)
          else
            # A push to main: compare with where main was before. If that commit is unknown (first
            # push, force push), run everything rather than guess.
            before='${{ github.event.before }}'
            git fetch -q --depth=1 origin "$before" 2>/dev/null || all
            files=$(git diff --name-only "$before" HEAD) || all
          fi
          echo "$files"
          has() { if echo "$files" | grep -qE "$1"; then echo "$2=true"; else echo "$2=false"; fi >> "$GITHUB_OUTPUT"; }
          # The unit tests that reach a changed file, and whether the site (or its smoke test) changed.
          echo "$files" | node scripts/ci/affected.mjs > /dev/null
          # Shipped solutions and what judges them: the per-language verifier.
          has '^(src/js/problems/|src/js/engine/|scripts/verify/|tests/(solutions|typescript|growth-solutions|programs)\.test\.js|package(-lock)?\.json|\.github/workflows/ci\.yml)' solutions
          # Schema and the git -> database sync, which reads the problem files.
          has '^(db/|scripts/db/|src/js/problems/|\.github/workflows/ci\.yml)' db
          # Pyodide steps of the smoke test: Python execution or problem content. A UI-only edit to
          # e2e/smoke.mjs skips them (owner's call, for speed): a change to the smoke test's own
          # Python steps should also touch one of these paths or ci.yml to run them.
          has '^(src/js/engine/|src/js/problems/|package(-lock)?\.json|\.github/workflows/ci\.yml)' python

  # The affected unit tests, database checks and the browser smoke test. Solutions are verified
  # per language in the `verify` jobs below (VERIFY_LANGUAGES=none skips them here).
  test:
    needs: changes
    if: needs.changes.outputs.tests != '' || needs.changes.outputs.e2e == 'true' || needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # tests/programs.test.js builds every problem's native program twice (about 7 minutes, most of
      # the unit test time): it has its own step below, run when the selection picks it.
      - name: Unit tests that reach the change
        if: needs.changes.outputs.tests != ''
        run: |
          tests=$(echo "${{ needs.changes.outputs.tests }}" | tr ' ' '\n' | grep -v '^tests/programs\.test\.js$' || true)
          if [ -n "$tests" ]; then node --test $tests; else echo "Only the native program builder tests reach this change."; fi
        env:
          VERIFY_LANGUAGES: none
      - name: Native program builder tests
        if: contains(needs.changes.outputs.tests, 'tests/programs.test.js')
        run: node --test tests/programs.test.js
      - name: Database schema and git -> database sync checks
        if: needs.changes.outputs.db == 'true'
        run: |
          ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql)
          bash scripts/db/check-schema.sh
      # The runner image has Google Chrome: use it rather than spend minutes downloading Chromium
      # and its system packages; download only where it is missing.
      - name: Browser for the smoke test
        id: browser
        if: needs.changes.outputs.e2e == 'true' || contains(needs.changes.outputs.tests, 'tests/share-pages.test.js')
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
            echo "channel=chrome" >> "$GITHUB_OUTPUT"
          else
            npx playwright install --with-deps chromium
          fi
      - name: E2E smoke test (Monaco, workers, Pyodide, zero console errors)
        if: needs.changes.outputs.e2e == 'true'
        run: node e2e/smoke.mjs --shots=e2e-shots ${{ needs.changes.outputs.python == 'true' && ' ' || '--no-python' }}
        env:
          PW_CHANNEL: ${{ steps.browser.outputs.channel }}
      # The preview images behind shared links are drawn on deploy: draw a sample here first, so a
      # broken card fails the PR, not the deploy. Runs when anything the pages read changed.
      - name: Share preview sample
        if: contains(needs.changes.outputs.tests, 'tests/share-pages.test.js')
        run: node scripts/share/build-share-pages.mjs --out=share-sample --sample=12
        env:
          PW_CHANNEL: ${{ steps.browser.outputs.channel }}
      - name: Upload screenshots
        if: always() && needs.changes.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-shots
          if-no-files-found: ignore

  # Every shipped solution, one job per language so the jobs run in parallel. The list must match
  # the languages in src/js/engine/codegen.js plus sql (tests/ci.test.js enforces it).
  verify:
    needs: changes
    if: needs.changes.outputs.solutions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lang: [python, javascript, typescript, java, cpp, c, csharp, go, sql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Python 3, gcc and g++ come with the runner image; npm ci installs TypeScript and sql.js.
      - if: matrix.lang == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.lang == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - if: matrix.lang == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --no-audit --no-fund
      - name: Verify ${{ matrix.lang }} solutions
        run: node --test tests/solutions.test.js
        env:
          VERIFY_LANGUAGES: ${{ matrix.lang }}
          # A missing toolchain fails the job instead of silently skipping the language.
          REQUIRE_ALL_LANGUAGES: '1'
      # TypeScript runs in the browser as transpiled JavaScript through the JavaScript adapter, a
      # different path from the tsc harness above: check that path too.
      - if: matrix.lang == 'typescript'
        name: Verify TypeScript as the browser runs it
        run: node --test tests/typescript.test.js
        env:
          VERIFY_LANGUAGES: typescript
          REQUIRE_ALL_LANGUAGES: '1'
      # Growth targets (ADR 0004): timed after the solutions, on its own, so nothing runs beside it.
      - if: matrix.lang == 'javascript'
        name: Verify growth targets (JavaScript timing)
        run: node --test tests/growth-solutions.test.js
        env:
          VERIFY_LANGUAGES: javascript
