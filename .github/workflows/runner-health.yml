name: Runner health

# End-to-end check of the remote runner (Worker -> Tunnel -> gate -> Piston). A failed run is the
# alert: GitHub emails the repository owner when a scheduled workflow fails. One deep check every
# 6 hours costs 4 of the Worker's 100,000 daily requests.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deep health check
        run: node scripts/runner-health.mjs
