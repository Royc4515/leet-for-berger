name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits instead of cancelling a deploy halfway (a cancelled
# deploy is a red run with nothing published); runs queued behind it collapse to the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Ship only what the browser needs: no tests, docs or tooling on the public site.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html privacy.html _site/
          cp -r src _site/
          touch _site/.nojekyll
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # A preview page and image for every shareable thing (scripts/share/build-share-pages.mjs),
      # drawn with the runner's own Chrome.
      - name: Share previews
        run: node scripts/share/build-share-pages.mjs --out=_site
        env:
          PW_CHANNEL: chrome
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # don't touch / its own job, after the build job: deploying in the same job, a second after the
  # upload, failed with "No artifacts named github-pages were found" (the artifact was not listed
  # yet). This is GitHub's own Pages layout.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # Pages itself sometimes answers "Deployment failed, try again later"; a re-run then
      # succeeds, so the job tries once more after a pause instead of leaving the site behind.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
