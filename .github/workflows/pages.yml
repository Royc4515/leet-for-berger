name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Ship only what the browser needs: no tests, docs or tooling on the public site.
      - name: Assemble site
        run: |
          mkdir _site
          cp index.html privacy.html _site/
          cp -r src _site/
          touch _site/.nojekyll
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      # A preview page and image for every shareable thing (scripts/share/build-share-pages.mjs),
      # drawn with the runner's own Chrome.
      - name: Share previews
        run: node scripts/share/build-share-pages.mjs --out=_site
        env:
          PW_CHANNEL: chrome
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
