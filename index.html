<!doctype html>
<html lang="en" dir="ltr">

    <meta name="description" content="Leet-For-Berger: interactive coding assessments with a 15-case test harness, learning path, interview simulator and battle mode." />

  <body>
    <a class="skip-link" href="#view">Skip to content</a>
    <header class="app-header">
      <a class="brand" href="#/" aria-label="Leet-For-Berger home">
        <span class="brand-mark" aria-hidden="true">{ }</span>
        <span class="brand-name">Leet<span>-For-</span>Berger</span>
      </a>
      <span id="header-title" class="header-title" aria-hidden="true">Problems</span>
      <nav class="nav" aria-label="Main">

        <a href="#/path" data-nav="path">Learning Path</a>
        <a href="#/companies" data-nav="companies">Companies</a>
        <a href="#/modes" data-nav="modes">Modes</a>
      </nav>
      <div class="header-right">
        <span id="streak-chip" class="streak-chip" title="0-day streak">
          <span class="streak-icon" aria-hidden="true">🔥</span>
          <span class="streak-count" aria-hidden="true">0</span>
          <span class="sr-only">0-day streak</span>
        </span>
        <div id="account" class="account-host"></div>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tab-bar" aria-label="Primary">
      <a href="#/" data-nav="problems">

      <a href="#/companies" data-nav="companies">
